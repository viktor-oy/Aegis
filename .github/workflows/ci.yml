name: ci

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.13"
      - run: python -m pip install --upgrade pip==24.3.1
      - run: python -m pip install -e '.[dev]'
      - run: ruff check services tests
      - run: mypy services/agent services/composer
      - run: pytest

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
      - run: go test ./...

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_topics.py
      - run: echo "Kubernetes manifest validation runs in the devcontainer with pinned kubectl/kustomize."

