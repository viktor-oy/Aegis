# aegis-system Helm Chart Default Values

global:
  namespace: aegis-system

agent:
  enabled: true
  image: "aegis-agent:latest"
  imagePullPolicy: IfNotPresent
  simulationMode: "normal"
  telemetryDataSource: "MOCK"
  workerIdFormat: "$(POD_NAMESPACE)--$(POD_NAME)"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

composer:
  enabled: true
  replicaCount: 1
  image: "aegis-composer:latest"
  imagePullPolicy: IfNotPresent
  kafkaBootstrapServers: "aegis-kafka:9092"
  llmBaseUrl: "http://aegis-llm.aegis-system.svc.cluster.local:11434/v1"
  llmModel: "llama3.2:1b"
  postmortem:
    labels:
      workerId: "Worker ID [{{ .Release.Namespace }}]"
      incidentId: "Incident ID"
      eventId: "Event ID"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

controlPlane:
  enabled: true
  replicaCount: 1
  image: "aegis-control-plane:latest"
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

sink:
  enabled: true
  replicaCount: 1
  image: "aegis-sink:latest"
  imagePullPolicy: IfNotPresent
  kafkaBrokers: "aegis-kafka:9092"
  debug: "false"
  fileSink:
    enabled: true
    path: "/tmp/aegis-postmortems"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    readOnlyRootFilesystem: false # Needed for file sink to /tmp
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

# Dependencies Configuration
kafka:
  enabled: true
  fullnameOverride: "aegis-kafka"
  podSecurityContext:
    enabled: true
    runAsUser: 1001
    fsGroup: 1001
  containerSecurityContext:
    enabled: true
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

redis:
  enabled: true
  fullnameOverride: "aegis-redis"
  architecture: "standalone"
  auth:
    enabled: false
  podSecurityContext:
    enabled: true
    runAsUser: 1001
    fsGroup: 1001
  containerSecurityContext:
    enabled: true
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]



mailpit:
  enabled: true
  fullnameOverride: "aegis-mailpit"

llm:
  enabled: false
  image: "aegis-llm:latest"
  imagePullPolicy: IfNotPresent
  model: "llama3.2:1b"
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "4Gi"
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
