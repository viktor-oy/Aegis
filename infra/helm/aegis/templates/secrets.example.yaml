apiVersion: v1
kind: Secret
metadata:
  name: aegis-postgres
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  password: change-me
  dsn: postgres://aegis:change-me@postgresql:5432/aegis?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: aegis-slack
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  webhook-url: http://mock-slack.aegis-system.svc.cluster.local/webhook
---
apiVersion: v1
kind: Secret
metadata:
  name: aegis-minio
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  root-user: aegis
  root-password: change-me-minio
---
