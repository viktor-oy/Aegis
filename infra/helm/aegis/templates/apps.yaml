{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aegis-agent
  namespace: {{ include "aegis.namespace" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "aegis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "aegis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      {{- if .Values.agent.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.agent.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: aegis-agent
          image: {{ required "agent.image is required" .Values.agent.image | quote }}
          imagePullPolicy: {{ .Values.agent.imagePullPolicy | default "IfNotPresent" | quote }}
          env:
            - name: AEGIS_CP_BOOTSTRAP_URLS
              value: {{ .Values.agent.bootstrapUrls | default "aegis-control-plane:50051" | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AEGIS_WORKER_ID
              value: {{ .Values.agent.workerIdFormat | default "$(POD_NAMESPACE)--$(POD_NAME)" | quote }}
            - name: AEGIS_SIMULATION_MODE
              value: {{ .Values.agent.simulationMode | default "normal" | quote }}
            - name: AEGIS_TELEMETRY_DATA_SOURCE
              value: {{ .Values.agent.telemetryDataSource | default "MOCK" | quote }}
            - name: AEGIS_AGENT_API_PORT
              value: {{ .Values.agent.apiPort | default 8080 | quote }}
            - name: AEGIS_HEARTBEAT_INTERVAL_SECONDS
              value: {{ .Values.agent.heartbeatIntervalSeconds | default 5 | quote }}
          ports:
            - containerPort: {{ .Values.agent.apiPort | default 8080 }}
              name: http
          {{- if .Values.agent.resources }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          {{- end }}
          {{- if .Values.agent.securityContext }}
          securityContext:
            {{- toYaml .Values.agent.securityContext | nindent 12 }}
          {{- end }}
{{- end }}
---
{{- if .Values.composer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-composer
  namespace: {{ include "aegis.namespace" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: composer
spec:
  replicas: {{ .Values.composer.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "aegis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: composer
  template:
    metadata:
      labels:
        {{- include "aegis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: composer
    spec:
      {{- if .Values.composer.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.composer.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: aegis-composer
          image: {{ required "composer.image is required" .Values.composer.image | quote }}
          imagePullPolicy: {{ .Values.composer.imagePullPolicy | default "IfNotPresent" | quote }}
          ports:
            - containerPort: {{ .Values.composer.port | default 8080 }}
              name: http
          env:
            - name: AEGIS_KAFKA_BOOTSTRAP_SERVERS
              value: {{ required "composer.kafkaBootstrapServers is required" .Values.composer.kafkaBootstrapServers | quote }}
            - name: AEGIS_COMPOSER_GROUP_ID
              value: {{ .Values.composer.groupId | default "aegis-postmortem-composer" | quote }}
            - name: AEGIS_COMPOSER_INPUT_TOPIC
              value: {{ .Values.composer.inputTopic | default "aegis.postmortem.requested" | quote }}
            - name: AEGIS_COMPOSER_OUTPUT_TOPIC
              value: {{ .Values.composer.outputTopic | default "aegis.postmortem.generated" | quote }}
            - name: AEGIS_LLM_BASE_URL
              value: {{ required "composer.llmBaseUrl is required when composer is enabled" .Values.composer.llmBaseUrl | quote }}
            - name: AEGIS_LLM_MODEL
              value: {{ required "composer.llmModel is required when composer is enabled" .Values.composer.llmModel | quote }}
            - name: POSTMORTEM_LABEL_WORKER_ID
              value: {{ tpl (.Values.composer.postmortem.labels.workerId | default "Worker ID") . | quote }}
            - name: POSTMORTEM_LABEL_INCIDENT_ID
              value: {{ tpl (.Values.composer.postmortem.labels.incidentId | default "Incident ID") . | quote }}
            - name: POSTMORTEM_LABEL_EVENT_ID
              value: {{ tpl (.Values.composer.postmortem.labels.eventId | default "Event ID") . | quote }}
            - name: AEGIS_COMPOSER_SYS_ARCH_PROMPT
              value: ""
            - name: AEGIS_COMPOSER_FORMAT_PROMPT
              value: ""
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.composer.port | default 8080 }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.composer.port | default 8080 }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- if .Values.composer.resources }}
          resources:
            {{- toYaml .Values.composer.resources | nindent 12 }}
          {{- end }}
          {{- if .Values.composer.securityContext }}
          securityContext:
            {{- toYaml .Values.composer.securityContext | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-composer
  namespace: {{ include "aegis.namespace" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: composer
spec:
  selector:
    {{- include "aegis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: composer
  ports:
    - port: {{ .Values.composer.port | default 8080 }}
      targetPort: {{ .Values.composer.port | default 8080 }}
      name: http
{{- end }}
---
{{- if .Values.controlPlane.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: aegis-control-plane-headless
  namespace: {{ include "aegis.namespace" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  clusterIP: None
  selector:
    {{- include "aegis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  ports:
    - name: grpc
      port: {{ .Values.controlPlane.grpcPort | default 50051 }}
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-control-plane
  namespace: {{ include "aegis.namespace" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  selector:
    {{- include "aegis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  ports:
    - name: grpc
      port: {{ .Values.controlPlane.grpcPort | default 50051 }}
      targetPort: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aegis-control-plane
  namespace: {{ include "aegis.namespace" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicaCount | default 1 }}
  serviceName: aegis-control-plane-headless
  selector:
    matchLabels:
      {{- include "aegis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        {{- include "aegis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
    spec:
      {{- if .Values.controlPlane.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.controlPlane.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: aegis-control-plane
          image: {{ required "controlPlane.image is required" .Values.controlPlane.image | quote }}
          imagePullPolicy: {{ .Values.controlPlane.imagePullPolicy | default "IfNotPresent" | quote }}
          ports:
            - name: grpc
              containerPort: {{ .Values.controlPlane.grpcPort | default 50051 }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AEGIS_CP_ID
              value: "$(POD_NAME)"
            - name: AEGIS_CP_ADDRESS
              value: "$(POD_NAME).aegis-control-plane-headless.{{ include "aegis.namespace" . }}.svc.cluster.local:{{ .Values.controlPlane.grpcPort | default 50051 }}"
            - name: AEGIS_GRPC_ADDRESS
              value: ":{{ .Values.controlPlane.grpcPort | default 50051 }}"
            - name: AEGIS_REDIS_ADDR
              value: {{ required "controlPlane.redisAddr is required" .Values.controlPlane.redisAddr | quote }}
            - name: AEGIS_KAFKA_BROKERS
              value: {{ required "controlPlane.kafkaBrokers is required" .Values.controlPlane.kafkaBrokers | quote }}
            - name: AEGIS_DEBUG
              value: {{ .Values.controlPlane.debug | default "false" | quote }}
            - name: AEGIS_QUEUE_SIZE
              value: {{ .Values.controlPlane.queueSize | default 256 | quote }}
            - name: AEGIS_INCIDENT_ID_TUMBLING_WINDOW
              value: {{ .Values.controlPlane.incidentIDTumblingWindow | default "1m" | quote }}
            - name: AEGIS_HEARTBEAT_EXPIRY_SECONDS
              value: {{ .Values.controlPlane.heartbeatExpirySeconds | default 15 | quote }}
            - name: AEGIS_FSM_WATCHDOG_STUCK_THRESHOLD_SECONDS
              value: {{ .Values.controlPlane.watchdogStuckThresholdSeconds | default 20 | quote }}
            - name: AEGIS_FSM_DEFERRAL_TTL_SECONDS
              value: {{ .Values.controlPlane.deferralTtlSeconds | default 10 | quote }}
            - name: AEGIS_FSM_DEFERRAL_TOLERANCE_SECONDS
              value: {{ .Values.controlPlane.deferralToleranceSeconds | default 5 | quote }}
          {{- if .Values.controlPlane.resources }}
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          {{- end }}
          {{- if .Values.controlPlane.securityContext }}
          securityContext:
            {{- toYaml .Values.controlPlane.securityContext | nindent 12 }}
          {{- end }}
{{- end }}
---
{{- if .Values.sink.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-sink
  namespace: {{ include "aegis.namespace" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: sink
spec:
  replicas: {{ .Values.sink.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "aegis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sink
  template:
    metadata:
      labels:
        {{- include "aegis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sink
    spec:
      {{- if .Values.sink.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.sink.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: aegis-sink
          image: {{ required "sink.image is required" .Values.sink.image | quote }}
          imagePullPolicy: {{ .Values.sink.imagePullPolicy | default "IfNotPresent" | quote }}
          env:
            - name: AEGIS_DEBUG
              value: {{ .Values.sink.debug | default "false" | quote }}
            - name: AEGIS_KAFKA_BROKERS
              value: {{ required "sink.kafkaBrokers is required" .Values.sink.kafkaBrokers | quote }}
            {{- if .Values.sink.fileSink }}
            - name: AEGIS_FILE_SINK_ENABLED
              value: {{ .Values.sink.fileSink.enabled | default false | quote }}
            {{- if .Values.sink.fileSink.enabled }}
            - name: AEGIS_FILE_SINK_PATH
              value: {{ required "sink.fileSink.path is required when fileSink is enabled" .Values.sink.fileSink.path | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.sink.emailSink }}
            - name: AEGIS_EMAIL_SINK_ENABLED
              value: {{ .Values.sink.emailSink.enabled | default false | quote }}
            {{- if .Values.sink.emailSink.enabled }}
            - name: AEGIS_SMTP_HOST
              value: {{ required "sink.emailSink.smtpHost is required when emailSink is enabled" .Values.sink.emailSink.smtpHost | quote }}
            - name: AEGIS_SMTP_PORT
              value: {{ required "sink.emailSink.smtpPort is required when emailSink is enabled" .Values.sink.emailSink.smtpPort | quote }}
            - name: AEGIS_SMTP_USER
              value: {{ .Values.sink.emailSink.smtpUser | default "" | quote }}
            - name: AEGIS_SMTP_PASS
              value: {{ .Values.sink.emailSink.smtpPass | default "" | quote }}
            - name: AEGIS_SMTP_TO
              value: {{ required "sink.emailSink.smtpTo is required when emailSink is enabled" .Values.sink.emailSink.smtpTo | quote }}
            - name: AEGIS_SMTP_FROM
              value: {{ required "sink.emailSink.smtpFrom is required when emailSink is enabled" .Values.sink.emailSink.smtpFrom | quote }}
            {{- end }}
            {{- end }}
          ports:
            - containerPort: 8081
          {{- if .Values.sink.resources }}
          resources:
            {{- toYaml .Values.sink.resources | nindent 12 }}
          {{- end }}
          {{- if .Values.sink.securityContext }}
          securityContext:
            {{- toYaml .Values.sink.securityContext | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-sink
  namespace: {{ include "aegis.namespace" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: sink
spec:
  selector:
    {{- include "aegis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: sink
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
{{- end }}
