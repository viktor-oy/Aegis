apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-llm
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-llm
    app.kubernetes.io/part-of: aegis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-llm
    spec:
      containers:
        - name: ollama
          image: aegis-llm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
              name: http
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          env:
            - name: OLLAMA_MODEL
              value: "llama3.2:3b"
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-llm
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-llm
spec:
  type: ClusterIP
  ports:
    - port: 11434
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: aegis-llm
