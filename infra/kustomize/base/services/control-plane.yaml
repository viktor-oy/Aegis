apiVersion: v1
kind: Service
metadata:
  name: aegis-control-plane-headless
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-control-plane
    app.kubernetes.io/part-of: aegis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: aegis-control-plane
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-control-plane
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-control-plane
    app.kubernetes.io/part-of: aegis
spec:
  selector:
    app.kubernetes.io/name: aegis-control-plane
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aegis-control-plane
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-control-plane
    app.kubernetes.io/part-of: aegis
spec:
  replicas: 1
  serviceName: aegis-control-plane-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-control-plane
        app.kubernetes.io/part-of: aegis
    spec:
      containers:
        - name: control-plane
          image: aegis-control-plane
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AEGIS_CP_ID
              value: "$(POD_NAME)"
            - name: AEGIS_CP_ADDRESS
              value: "$(POD_NAME).aegis-control-plane-headless.aegis-system.svc.cluster.local:50051"
            - name: AEGIS_GRPC_ADDRESS
              value: ":50051"
            - name: AEGIS_REDIS_ADDR
              value: "redis.aegis-system.svc.cluster.local:6379"
            - name: AEGIS_KAFKA_BROKERS
              value: "kafka.aegis-system.svc.cluster.local:9092"
