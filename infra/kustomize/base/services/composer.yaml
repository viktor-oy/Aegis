apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-composer
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-composer
    app.kubernetes.io/component: composer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-composer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-composer
        app.kubernetes.io/component: composer
    spec:
      containers:
        - name: composer
          image: aegis-composer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: AEGIS_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: AEGIS_COMPOSER_GROUP_ID
              value: "aegis-postmortem-composer"
            - name: AEGIS_COMPOSER_INPUT_TOPIC
              value: "aegis.diagnostics.collected"
            - name: AEGIS_COMPOSER_OUTPUT_TOPIC
              value: "aegis.postmortem.generated"
            - name: AEGIS_LLM_BASE_URL
              value: "http://aegis-llm.aegis-system.svc.cluster.local:11434/v1"
            - name: AEGIS_LLM_MODEL
              value: "llama3.2:3b"
            - name: AEGIS_COMPOSER_SYS_ARCH_PROMPT
              value: ""
            - name: AEGIS_COMPOSER_FORMAT_PROMPT
              value: ""
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-composer
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-composer
spec:
  selector:
    app.kubernetes.io/name: aegis-composer
  ports:
    - port: 8080
      targetPort: 8080
      name: http
