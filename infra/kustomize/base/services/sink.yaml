apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-sink
  labels:
    app: aegis-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegis-sink
  template:
    metadata:
      labels:
        app: aegis-sink
    spec:
      containers:
        - name: sink
          image: aegis-sink
          imagePullPolicy: Never
          env:
            - name: AEGIS_DEBUG
              value: "true"
            - name: AEGIS_KAFKA_BROKERS
              value: "kafka:9092"
            - name: AEGIS_FILE_SINK_ENABLED
              value: "true"
            - name: AEGIS_FILE_SINK_PATH
              value: "/tmp/aegis-postmortems"
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-sink
spec:
  selector:
    app: aegis-sink
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
