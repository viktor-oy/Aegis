[env]
# Required for Go plugins to work correctly
GOPATH = "{{env.HOME}}/go"
PATH = "{{env.GOPATH}}/bin:{{env.PATH}}"

[tools]
python = "3.14.1"
go = "1.25.5"
kubectl = "1.34.8"
helm = "4.1.3"
kustomize = "5.8.1"
terraform = "1.12.2"
kind = "0.29.0"
tilt = "0.33.22"
protoc = "29.5"

[tasks.setup]
description = "Install Python dependencies (Fails loudly if pyproject.toml is missing)"
run = """
python -m pip install --upgrade pip==24.3.1
python -m pip install -e '.[dev]'
"""

[tasks.protoc-plugins]
description = "Install Go protobuf plugins"
run = """
go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.0
go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
"""